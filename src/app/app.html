@if (isLoggedIn()) {
  <nav class="navbar">
    <div class="nav-list">
      <button (click)="goTo('/dashboard')" class="nav-btn">Dashboard</button>
      <button (click)="goTo('/enroll')" class="nav-btn">Enrollment Form</button>

       @if (canManagePrograms()) {
        <button (click)="goTo('/admin/programs')" class="nav-btn">Training Programs</button>
      }

      @if (isStudent()) {
        <button (click)="goTo('/my-progress')" class="nav-btn">My Progress</button>
      }

      @if (isAdmin()) {
        <button (click)="goTo('/enrollments')" class="nav-btn">Enrollments</button>
        <button (click)="goTo('/instructor-dashboard')" class="nav-btn">Instructor</button>
        <button (click)="goTo('/grade-submission')" class="nav-btn">Grade</button>
        <button (click)="goTo('/admin/courses')" class="nav-btn">Admin</button>
        <button (click)="goTo('/admin/classrooms')" class="nav-btn">Classrooms</button>
       
      }

      @if (canTakeAttendance()) {
        <button (click)="goTo('/attendance/sessions')" class="nav-btn">Attendance</button>
      }

      @if (canViewReports()) { <button (click)="goTo('/admin/reports')" class="nav-btn">Reports & Analytics</button> }
      <button (click)="goTo('/notifications')" class="nav-btn">Notifications</button>
      <app-notification-bell />
      <button (click)="logout()" class="nav-btn">Logout</button>
    </div>
  </nav>
}

<router-outlet />
