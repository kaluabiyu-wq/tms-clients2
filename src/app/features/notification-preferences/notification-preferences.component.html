<main class="settings"><h1>Notification preferences</h1><p>Choose how TMS should contact you. Email and SMS require a valid address or phone number on your account.</p><section><label><span><strong>In-app notifications</strong><small>Show alerts in your TMS notification center.</small></span><input type="checkbox" [ngModel]="preference().inAppEnabled" (ngModelChange)="update('inAppEnabled',$event)"></label><label><span><strong>Email notifications</strong><small>Send important updates to your registered email.</small></span><input type="checkbox" [ngModel]="preference().emailEnabled" (ngModelChange)="update('emailEnabled',$event)"></label><label><span><strong>SMS notifications</strong><small>Send short alerts to your registered phone number.</small></span><input type="checkbox" [ngModel]="preference().smsEnabled" (ngModelChange)="update('smsEnabled',$event)"></label><button (click)="save()" [disabled]="saving()">{{saving()?'Saving…':'Save preferences'}}</button>@if(message()){<p class="message">{{message()}}</p>}</section></main>
