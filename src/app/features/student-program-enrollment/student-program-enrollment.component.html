<main class="page"><a routerLink="/admin/programs">← All programs</a><h1>Register student in a program</h1>@if(error()){<p class="error">{{error()}}</p>}<section class="panel"><label>Student ID<input type="number" min="1" [(ngModel)]="studentId"></label><label>Training program<select [(ngModel)]="programId"><option [ngValue]="0">Select program</option>@for(p of programs();track p.id){<option [ngValue]="p.id">{{p.code}} — {{p.name}}</option>}</select></label><button [disabled]="saving()" (click)="register()">{{saving()?'Registering…':'Register student'}}</button></section>@if(result();as r){<section class="panel success"><h2>{{r.studentName}} registered</h2><p>{{r.programName}} · {{r.completionPercent}}% complete</p><a [routerLink]="['/admin/students',r.studentId,'progress']">Open progress tracker</a></section>}</main>
